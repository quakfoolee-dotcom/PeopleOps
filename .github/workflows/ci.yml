name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Verify contract schemas
        run: python scripts/export_contract_schemas.py --check
      - name: Validate policy corpus and mock data
        run: python scripts/validate_phase3_assets.py
      - name: Verify persisted RAG index
        run: python scripts/build_rag_index.py --check
      - name: Evaluate Phase 6 MCP tool suite
        run: python scripts/evaluate_mcp_tools.py
      - name: Evaluate Phase 7 bounded workflows
        run: python scripts/evaluate_workflows.py
      - name: Test
        run: python -m pytest --cov=app --cov=peopleops_mcp --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t peopleops-assistant:ci .
