name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir -p artifacts
      - name: Lint
        run: python -m ruff check .
      - name: Verify contract schemas
        run: python scripts/export_contract_schemas.py --check
      - name: Validate policy corpus and mock data
        run: python scripts/validate_phase3_assets.py
      - name: Verify persisted RAG index
        run: python scripts/build_rag_index.py --check
      - name: Verify neural embedding comparison evidence
        run: python scripts/evaluate_embeddings.py --check
      - name: Verify hosted provider evaluation evidence
        run: python scripts/evaluate_hosted_provider.py --check
      - name: Evaluate Phase 6 MCP tool suite
        run: python scripts/evaluate_mcp_tools.py
      - name: Evaluate Phase 7 bounded workflows
        run: python scripts/evaluate_workflows.py
      - name: Evaluate intent-routing robustness
        run: python scripts/evaluate_intents.py
      - name: Evaluate Phase 10 gold-suite gates
        run: >-
          python scripts/evaluate_gold.py
          --reliability-repeats 2
          --latency-sample-count 10
          > artifacts/phase10-gold-evaluation.json
      - name: Test
        run: >-
          python -m pytest
          --cov=app
          --cov=peopleops_mcp
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage.xml
          --cov-fail-under=85
          --junitxml=artifacts/pytest.xml
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  container:
    name: Container startup and workflow smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build production image
        run: docker build -t peopleops-assistant:ci .
      - name: Start production image
        run: >-
          docker run --detach
          --name peopleops-startup-smoke
          --publish 8000:8000
          --env APP_RELEASE_SHA="${GITHUB_SHA}"
          --env MCP_SERVER_URL=http://127.0.0.1:8000/mcp
          --env LLM_PROVIDER=deterministic
          --env LLM_MODEL=deterministic-grounded-v1
          peopleops-assistant:ci
      - name: Verify startup and read-only MCP workflow
        run: >-
          python scripts/smoke_deployment.py
          --base-url http://127.0.0.1:8000
          --expected-environment production
          --expected-release-sha "${GITHUB_SHA}"
          --expected-llm-provider deterministic
          --deadline-seconds 90
          --output artifacts/container-smoke.json
      - name: Capture failed container logs
        if: failure()
        run: docker logs peopleops-startup-smoke
      - name: Stop test container
        if: always()
        run: docker rm --force peopleops-startup-smoke || true
      - name: Upload container smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-smoke-${{ github.run_id }}
          path: artifacts/container-smoke.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend, frontend, container]
    steps:
      - name: Require every release check
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "${BACKEND_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${CONTAINER_RESULT}" = "success"
